[package]
name = "indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.83"
clap = "4.5.23"
futures = "0.3.31"
gasket = { version = "^0.7", features = ["derive"] }
gasket-prometheus = { version = "^0.7" }
hex = "0.4.3"
log = "0.4.22"
oura = { git = "https://github.com/txpipe/oura", branch = "main" }
pallas = { git = "https://github.com/txpipe/pallas", features = ["hardano"] }
serde = "1.0.216"
sqlx = { version = "0.8.2", features = ["postgres", "runtime-tokio", "rust_decimal", "tls-rustls-ring"] }
tokio = { version = "1.42.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = "2.5.4"
