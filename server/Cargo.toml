[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.89"
axum = "0.8"
bech32 = "0.11"
clap = "4.5.57"
futures = "0.3.31"
gasket = { version = "^0.7", features = ["derive"] }
gasket-prometheus = { version = "^0.7" }
hex = "0.4.3"
im = { version = "15.1.0", features = ["serde"] }
log = "0.4.29"
oura = "2.0.0"
pallas = "0.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "rust_decimal", "tls-rustls-ring"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = "2.5.8"
