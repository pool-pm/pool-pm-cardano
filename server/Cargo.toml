[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.89"
axum = "0.8"
bech32 = "0.11"
clap = "4.5.57"
futures = "0.3.31"
gasket = { version = "^0.7", features = ["derive"] }
gasket-prometheus = { version = "^0.7" }
hex = "0.4.3"
imbl = { version = "3", features = ["serde"] }
log = "0.4.29"
oura = { git = "https://github.com/txpipe/oura.git", tag = "v2.0.1" }
pallas = "0.35"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "rust_decimal", "tls-rustls-ring"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = "2.5.8"
base64 = "0.22"
rmp-serde = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
tar = "0.4"
